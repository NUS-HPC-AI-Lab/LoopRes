model:
  name: Qwen/Qwen3-1.7B-Base
  # Packed samples reach attention as document boundaries only through flash attention.
  attn_implementation: flash_attention_2
  steps: 3
  loop_layers: [7, 21]
  # Blocks of 7 of the 14 core layers.
  attn_res_blocks: 2
  previous_step: 1
data:
  train: data/Qwen3-235B-A22B-16k/train
  sample_length: 16384

training:
  run_name: loopres
  output_dir: outputs/loopres
  report_to: wandb
  seed: 42
  epochs: 1
  max_steps: 12000
  # A training step is gradient_accumulation_steps micro-batches of per_device_train_batch_size packed samples per rank.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  warmup_ratio: 3.0e-2
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  gradient_checkpointing: true
  save_steps: 4000
