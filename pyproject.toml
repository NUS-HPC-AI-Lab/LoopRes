[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopres"
version = "0.1.0"
description = "LoopRes: looped-transformer training, serving and evaluation on Qwen3"
requires-python = ">=3.10"
# Every package `loopres/` and `scripts/` import directly; flash-attn is built for the host.
dependencies = [
  # `scripts.download_benchmarks` reads the benchmark datasets through it.
  "datasets>=2.16,<4",
  "huggingface_hub>=0.23",
  # The math tasks' grading in `scripts/tasks/utils.py`.
  "latex2sympy2_extended>=1.10",
  "lm_eval==0.4.13",
  "math-verify>=0.9",
  "numpy>=1.24",
  "PyYAML>=6.0",
  # 2.11's default wheels need CUDA 13.
  "torch>=2.6,<2.11",
  "tqdm>=4.66",
  # The model's forward calls `Qwen3Model._update_causal_mask`, gone in 4.53.
  "transformers>=4.52,<4.53",
  # `loopres/kernels.py`'s read kernel; it arrives with torch on Linux.
  "triton>=3.0",
  "wandb",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loopres*", "scripts*"]

[tool.setuptools.package-data]
# The benchmark task YAMLs `scripts.eval` hands to lm-evaluation-harness.
scripts = ["tasks/*"]
